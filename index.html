<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excursion</title>
    <link rel="stylesheet" href="./resources/css/style.css" />
  </head>
  <body>
    <header class="centered-text">
      <h1 class="headers">Discover hidden places around the world</h1>
      <p
        class="link uni-margin"
        title="Go to www.excursion.com/downloads to download the Excursion App"
      >
        <a href="#">Download Excursion (Coming soon!)</a>
      </p>
    </header>
    <main class="uni-margin">
      <video
        class="uni-margin"
        width="500"
        height="750"
        autoplay
        muted
        controls
        loop
      >
        <source src="./resources/videos/excursion.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <h2 class="headers centered-text uni-margin">
        Your personal travel guide
      </h2>
      <p class="paragraph centered-text uni-margin">
        Excursion remembers places you like, and recommends new points of
        interest around you.
      </p>
      <p class="uni-margin">
        <img
          class="img"
          src="./resources/images/camp.webp"
          alt="Camping in the dessert at night"
        />
      </p>
    </main>
    <footer class="centered-text">
      <p class="phone">
        <img src="./resources/images/phone.webp" alt="Mobile phone icon" />
      </p>
      <h2 class="headers uni-margin">Coming soon for iPhone and Android</h2>
      <p
        class="link uni-margin"
        title="Go to www.excursion.com/downloads to download the Excursion App"
      >
        <a href="#">Download Excursion (Coming soon!)</a>
      </p>
      <p class="paragraph uni-margin copy">&copy Excursion</p>
    </footer>
  </body>
</html>
